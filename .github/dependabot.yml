version: 2
updates:
  # Workflow actions are pinned to commit SHAs, so this is what keeps them current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week before proposing a newly published version. A compromised
    # release is usually found and pulled well inside that window, and nothing
    # here is urgent enough to want it sooner.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Standard library only, so there is nothing to install.
      - run: python3 hack/validate.py all

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validator tests
        run: python3 -m unittest discover -s hack/tests -t hack/tests -v
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Script tests
        run: bats hack/tests/bats

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck
        run: |
          # git ls-files, not a glob: a skill may download something into its own
          # scripts/ and gitignore it, and a glob would hand shellcheck a binary.
          # CI never runs a skill, but the same lines run locally via make lint.
          mapfile -t files < <(git ls-files 'skills/*/scripts/*' 'hack/hooks/*')
          [ ${#files[@]} -eq 0 ] && { echo "no scripts"; exit 0; }
          shellcheck -x -S style "${files[@]}"
      - name: SPDX headers
        run: |
          missing=0
          for f in $(git ls-files 'skills/*/scripts/*' 'hack/hooks/*'); do
            if ! head -5 "$f" | grep -q 'SPDX-License-Identifier'; then
              echo "$f: missing SPDX-License-Identifier header" >&2
              missing=1
            fi
          done
          exit $missing

  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # The same patterns the pre-commit hook enforces, over the whole tree.
      # gitleaks below is a second, broader pass.
      - name: Credential patterns
        run: python3 hack/validate.py secrets
      # The CLI, not gitleaks-action: the action requires a paid licence for
      # organization-owned repositories, and a fork PR could never supply it.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
      - name: gitleaks
        run: gitleaks detect --source . --no-banner --redact --exit-code 1

      - name: Install semgrep
        run: pip install --user semgrep
      # A pinned ruleset, not --config=auto: auto fetches rules at run time, so
      # an upstream rule change reddens every open pull request with no change
      # here. canary.yml tracks the moving target instead.
      - name: semgrep
        run: semgrep scan --config=p/default --error --quiet

  plugin-manifest:
    name: plugin manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      # Pinned rather than @latest, so an upstream CLI change cannot turn every
      # contributor's PR red. canary.yml tracks @latest on a schedule instead.
      - run: npm i -g @anthropic-ai/claude-code@2.1.158
      - name: Validate manifests
        env:
          CI: "true"
          DISABLE_AUTOUPDATER: "1"
        run: |
          # Pre-seed onboarding; a first run in a pristine HOME can otherwise hang.
          printf '{"hasCompletedOnboarding":true}' > "$HOME/.claude.json"
          timeout 120 claude plugin validate .claude-plugin/plugin.json --strict
          timeout 120 claude plugin validate .claude-plugin/marketplace.json --strict
